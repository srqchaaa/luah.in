
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>luah.in</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f2;color:#222;margin:0;padding:24px}
main{max-width:600px;margin:auto}
h1{letter-spacing:-2px}
p{color:#666}
textarea,input,button{box-sizing:border-box;width:100%;padding:13px;margin:7px 0;border:1px solid #ddd;border-radius:12px;font:inherit}
textarea{height:130px;resize:vertical}
button{background:#222;color:white;cursor:pointer}
.post{background:white;padding:16px;border:1px solid #ddd;border-radius:14px;margin:12px 0;overflow-wrap:anywhere}
.small{font-size:12px}
</style>
</head>
<body>
<main>
<h1>luah.in.</h1>
<p>ruang untuk meluah, tanpa perlu berpura-pura.</p>
<div class="post">
<strong>hai, stranger.</strong>
<p>apa yang kau pendam hari ni?</p>
<form id="form">
<input id="name" maxlength="24" placeholder="username atau anonymous">
<textarea id="message" maxlength="2000" required placeholder="tulis apa yang kau rasa..."></textarea>
<button type="submit">simpan luahan</button>
</form>
<p class="small">demo ini menyimpan luahan pada browser ini sahaja. jangan tulis maklumat peribadi.</p>
</div>
<h2>ruang komuniti</h2>
<div id="posts"></div>
</main>
<script>
const form=document.getElementById('form');
const posts=document.getElementById('posts');
let entries=[];
try{entries=JSON.parse(localStorage.getItem('luahin-posts')||'[]')}catch(e){}
function show(){
posts.replaceChildren();
entries.forEach((p,i)=>{
const card=document.createElement('article');
card.className='post';
const title=document.createElement('strong');
title.textContent=p.name;
const msg=document.createElement('p');
msg.textContent=p.message;
const report=document.createElement('button');
report.textContent='laporkan';
report.onclick=()=>alert('demo sahaja: laporan belum dihantar kepada moderator.');
const del=document.createElement('button');
del.textContent='padam';
del.onclick=()=>{entries.splice(i,1);save()};
card.append(title,msg,report,del);posts.append(card);
});
if(!entries.length)posts.textContent='belum ada luahan. kau boleh mula dulu.';
}
function save(){
localStorage.setItem('luahin-posts',JSON.stringify(entries));
show();
}
form.addEventListener('submit',e=>{
e.preventDefault();
const message=document.getElementById('message').value.trim();
if(!message)return;
const name=document.getElementById('name').value.trim()||'anonymous';
entries.unshift({name,message});
save();form.reset();
});
show();
</script>
</body>
</html>
